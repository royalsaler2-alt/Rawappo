<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تطبيق تقرير المبيعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<!-- CDN libraries (cdnjs.cloudflare.com) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ================= Design tokens ================= */
:root{
  --bg:#f1f5f2; --bg2:#e9efe9; --card:#ffffff; --card2:#f6faf7;
  --ink:#182420; --mut:#61736c; --line:#dfe8e2; --line2:#cfdcd4;
  --brand:#0d8a6a; --brand2:#0a6b53; --brand-soft:rgba(13,138,106,.10);
  --amber:#e0912f; --amber-soft:rgba(224,145,47,.14);
  --blue:#3d7ea6; --blue-soft:rgba(61,126,166,.14);
  --ok:#1f9d66; --ok-soft:rgba(31,157,102,.13);
  --warn:#dd9426; --warn-soft:rgba(221,148,38,.15);
  --bad:#d95448; --bad-soft:rgba(217,84,72,.12);
  --grad:linear-gradient(135deg,#0d8a6a,#38b183);
  --grad-amber:linear-gradient(135deg,#e0912f,#f2b95c);
  --grad-blue:linear-gradient(135deg,#3d7ea6,#63a8cf);
  --sh:0 1px 2px rgba(24,42,36,.05),0 10px 28px -14px rgba(24,42,36,.22);
  --sh-lg:0 2px 6px rgba(24,42,36,.06),0 22px 48px -20px rgba(24,42,36,.30);
  --r:14px; --r-s:10px;
}
html[data-theme="dark"]{
  --bg:#0d1412; --bg2:#0a100e; --card:#141e1b; --card2:#182420;
  --ink:#e5eeea; --mut:#8ba19a; --line:#233129; --line2:#2e4038;
  --brand:#31bd91; --brand2:#269a76; --brand-soft:rgba(49,189,145,.13);
  --amber:#f0a94b; --amber-soft:rgba(240,169,75,.15);
  --blue:#5ba3cc; --blue-soft:rgba(91,163,204,.15);
  --ok:#33b37d; --ok-soft:rgba(51,179,125,.15);
  --warn:#e6a544; --warn-soft:rgba(230,165,68,.16);
  --bad:#e8695d; --bad-soft:rgba(232,105,93,.14);
  --grad:linear-gradient(135deg,#26a37c,#3ecb9c);
  --sh:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.55);
  --sh-lg:0 2px 6px rgba(0,0,0,.35),0 24px 50px -20px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Tajawal',system-ui,sans-serif; background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.65; min-height:100vh;
}
/* ambient layered background */
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(700px 420px at 88% -6%, var(--brand-soft), transparent 65%),
    radial-gradient(600px 400px at 4% 108%, var(--amber-soft), transparent 60%),
    linear-gradient(var(--bg),var(--bg));
}
h1,h2,h3,h4,.disp{font-family:'Cairo','Tajawal',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
::selection{background:var(--brand-soft)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

.ic{width:18px;height:18px;flex:none;vertical-align:-3px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ================= Layout ================= */
#app{display:flex;min-height:100vh}
#sidebar{
  width:258px;flex:none;background:var(--card);border-inline-end:1px solid var(--line);
  position:fixed;inset-block:0;inset-inline-start:0;z-index:60;display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;border-bottom:1px dashed var(--line)}
.sb-logo{width:42px;height:42px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px var(--brand)}
.sb-logo .ic{width:23px;height:23px}
.sb-brand h1{font-size:15.5px;font-weight:900;letter-spacing:.2px;line-height:1.25}
.sb-brand small{display:block;color:var(--mut);font-size:10.5px;font-weight:500}
#sb-nav{padding:12px 10px;overflow-y:auto;flex:1}
.sb-label{font-size:10.5px;font-weight:700;color:var(--mut);padding:12px 12px 6px;letter-spacing:.3px}
.nav-it{
  display:flex;align-items:center;gap:11px;width:100%;text-align:start;padding:10px 12px;margin:2px 0;
  border-radius:var(--r-s);color:var(--mut);font-weight:600;font-size:13.5px;position:relative;transition:.18s;
}
.nav-it:hover{background:var(--card2);color:var(--ink)}
.nav-it.on{background:var(--brand-soft);color:var(--brand)}
.nav-it.on::before{content:"";position:absolute;inset-inline-start:-10px;top:22%;bottom:22%;width:3.5px;border-radius:4px;background:var(--brand)}
.nav-it .ic{width:19px;height:19px}
.nav-it .nbadge{margin-inline-start:auto;background:var(--card2);border:1px solid var(--line);border-radius:20px;font-size:10.5px;padding:1px 8px;color:var(--mut);font-weight:700}
.nav-it.on .nbadge{background:var(--card);color:var(--brand)}
.sb-foot{padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mut);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sb-foot .stor{display:flex;align-items:center;gap:6px}

#main{flex:1;margin-inline-start:258px;display:flex;flex-direction:column;min-width:0}
#topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:13px 26px;background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
#tb-title{font-size:19px;font-weight:800}
#tb-date{color:var(--mut);font-size:12px;margin-top:-3px}
.tb-sp{flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:11px;display:inline-grid;place-items:center;
  background:var(--card);border:1px solid var(--line);color:var(--mut);transition:.18s;box-shadow:var(--sh);
}
.iconbtn:hover{color:var(--brand);border-color:var(--brand);transform:translateY(-1px)}
#btn-menu{display:none}

#pages{padding:22px 26px 60px;max-width:1460px;width:100%;margin-inline:auto}
.page{display:none}
.page.on{display:block;animation:pgIn .38s cubic-bezier(.3,.7,.3,1)}
@keyframes pgIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ================= Cards / widgets ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.widget{padding:18px;position:relative;transition:box-shadow .2s}
.widget:hover{box-shadow:var(--sh-lg)}
.wg-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.wg-head h3{font-size:14.5px;font-weight:800;flex:1}
.wg-head .wg-sub{font-size:11.5px;color:var(--mut);font-weight:500}
.eye-btn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mut);transition:.15s}
.eye-btn:hover{background:var(--card2);color:var(--brand)}
.eye-btn .ic{width:15px;height:15px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:1fr 1fr}.g-3{grid-template-columns:repeat(3,1fr)}
.g-21{grid-template-columns:1.9fr 1fr}.g-12{grid-template-columns:1fr 1.9fr}
.g-221{grid-template-columns:1.2fr 1.2fr .9fr}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8.5px 15px;border-radius:var(--r-s);
  font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  transition:.18s;white-space:nowrap;
}
.btn:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px);box-shadow:var(--sh)}
.btn .ic{width:16px;height:16px}
.btn-p{background:var(--grad);border:none;color:#fff;box-shadow:0 7px 18px -8px var(--brand)}
.btn-p:hover{color:#fff;filter:brightness(1.07);box-shadow:0 10px 22px -8px var(--brand)}
.btn-a{background:var(--grad-amber);border:none;color:#fff;box-shadow:0 7px 18px -8px var(--amber)}
.btn-a:hover{color:#fff;filter:brightness(1.06)}
.btn-d{background:var(--bad);border:none;color:#fff}
.btn-d:hover{color:#fff;filter:brightness(1.08)}
.btn-ghost{background:transparent;box-shadow:none}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}

/* inputs */
.inp,select.inp,textarea.inp{
  width:100%;padding:8.5px 12px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--card2);transition:.15s;outline:none;
}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);background:var(--card)}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label{font-size:12px;font-weight:700;color:var(--mut)}
.searchbox{position:relative;flex:1;min-width:190px}
.searchbox .ic{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--mut);width:16px;height:16px;pointer-events:none}
.searchbox input{padding-inline-start:35px}

/* filter bar */
.fbar{padding:13px 15px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fbar .adv{display:none;width:100%;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding-top:12px;margin-top:3px;border-top:1px dashed var(--line)}
.fbar.open .adv{display:grid;animation:pgIn .25s}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card2);font-size:12px;font-weight:700;color:var(--mut);transition:.15s;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .x{opacity:.6}.chip .x:hover{opacity:1}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{padding:16px 17px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--grad)}
.kpi.k-amber::after{background:var(--grad-amber)}
.kpi.k-blue::after{background:var(--grad-blue)}
.kpi .k-ic{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:10px}
.kpi.k-amber .k-ic{background:var(--amber-soft);color:var(--amber)}
.kpi.k-blue .k-ic{background:var(--blue-soft);color:var(--blue)}
.kpi .k-lb{font-size:12px;color:var(--mut);font-weight:700}
.kpi .k-v{font-family:'Cairo';font-size:25px;font-weight:900;line-height:1.3;letter-spacing:-.3px}
.kpi .k-sub{font-size:12px;color:var(--mut);font-weight:600}
.kpi .k-tr{position:absolute;top:14px;inset-inline-end:14px;display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px}
.k-tr.up{color:var(--ok);background:var(--ok-soft)}
.k-tr.dn{color:var(--bad);background:var(--bad-soft)}
.k-tr.fl{color:var(--mut);background:var(--card2)}
.kpi:hover .k-ic{transform:scale(1.08) rotate(-4deg)}
.kpi .k-ic{transition:.25s}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-s)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.tbl th{
  background:var(--card2);padding:10px 12px;text-align:start;font-size:12px;font-weight:800;color:var(--mut);
  border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:2;
}
.tbl th:hover{color:var(--brand)}
.tbl th .s-ar{font-size:10px;opacity:.7}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr{transition:.12s}
.tbl tbody tr:hover{background:var(--card2)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tfoot td{background:var(--card2);font-weight:800;border-top:2px solid var(--line2);position:sticky;bottom:0}
.tnum{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-align:end;font-weight:600}
.st{display:inline-block;padding:2.5px 10px;border-radius:20px;font-size:11px;font-weight:800}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-warn{background:var(--warn-soft);color:var(--warn)}
.st-bad{background:var(--bad-soft);color:var(--bad)}
.st-mut{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.cat-chip{display:inline-flex;align-items:center;gap:5px;padding:2.5px 10px;border-radius:20px;font-size:11px;font-weight:800;background:var(--brand-soft);color:var(--brand2)}
html[data-theme="dark"] .cat-chip{color:var(--brand)}
.cat-chip.c-other{background:var(--card2);color:var(--mut);border:1px dashed var(--line2)}
.rowact{display:flex;gap:4px}
.rbtn{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;color:var(--mut);transition:.15s}
.rbtn:hover{background:var(--brand-soft);color:var(--brand)}
.rbtn.dngr:hover{background:var(--bad-soft);color:var(--bad)}
.rbtn .ic{width:15px;height:15px}

/* pagination */
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 4px 0;font-size:12.5px;color:var(--mut);font-weight:600}
.pager .pg{min-width:31px;height:31px;padding:0 7px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:700;color:var(--mut);transition:.15s;display:inline-grid;place-items:center}
.pager .pg:hover{border-color:var(--brand);color:var(--brand)}
.pager .pg.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pager .pginfo{margin-inline-start:auto}
.pager select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2)}

/* lists */
.ranklist{display:flex;flex-direction:column;gap:4px}
.rank{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);transition:.15s;position:relative}
.rank:hover{background:var(--card2);transform:translateX(-3px)}
.rank .rk{width:24px;height:24px;border-radius:8px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--mut);flex:none}
.rank:nth-child(1) .rk{background:var(--grad-amber);color:#fff;border:none}
.rank:nth-child(2) .rk{background:var(--brand-soft);color:var(--brand);border:none}
.rank:nth-child(3) .rk{background:var(--blue-soft);color:var(--blue);border:none}
.rank .r-name{font-weight:700;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .r-bar{position:absolute;inset-inline-start:0;bottom:2px;height:2.5px;background:var(--grad);border-radius:3px;opacity:.55;transition:width .8s cubic-bezier(.3,.7,.3,1)}
.rank .r-val{font-weight:800;font-size:12.5px;color:var(--brand);font-variant-numeric:tabular-nums;direction:ltr}
.rank .r-cnt{font-size:11px;color:var(--mut);font-weight:700}
.rank select.cat-sel{font-size:10.5px;padding:2px 6px;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--mut);max-width:96px}

/* empty state */
.empty{padding:38px 20px;text-align:center;color:var(--mut)}
.empty svg{width:110px;height:90px;margin-bottom:10px;opacity:.9}
.empty h4{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:4px}
.empty p{font-size:12.5px;margin-bottom:14px}

/* modal */
.modal-ov{position:fixed;inset:0;background:rgba(10,20,17,.5);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:18px;animation:fdIn .2s}
@keyframes fdIn{from{opacity:0}}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-lg);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;animation:mdIn .28s cubic-bezier(.3,.8,.3,1.1)}
.modal.wide{max-width:860px}
@keyframes mdIn{from{opacity:0;transform:translateY(22px) scale(.97)}}
.md-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.md-h h3{font-size:15.5px;font-weight:800;flex:1}
.md-b{padding:18px 20px;overflow-y:auto}
.md-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-start;gap:9px}

/* toasts */
#toasts{position:fixed;bottom:20px;inset-inline-start:20px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--brand);border-radius:12px;padding:11px 16px;box-shadow:var(--sh-lg);font-size:13px;font-weight:700;min-width:240px;max-width:360px;animation:tIn .3s cubic-bezier(.3,.8,.3,1.1)}
.toast.err{border-inline-start-color:var(--bad)}
.toast.warn{border-inline-start-color:var(--warn)}
.toast .ic{width:18px;height:18px;color:var(--brand)}
.toast.err .ic{color:var(--bad)}.toast.warn .ic{color:var(--warn)}
@keyframes tIn{from{opacity:0;transform:translateY(16px)}}
.toast.out{opacity:0;transform:translateX(-14px);transition:.3s}

/* heat map */
.hm{display:grid;gap:4px;direction:ltr}
.hm .hc{aspect-ratio:1.55;border-radius:6px;background:var(--card2);border:1px solid var(--line);position:relative;cursor:default;transition:.15s;min-height:26px}
.hm .hc:hover{transform:scale(1.12);z-index:2;box-shadow:var(--sh)}
.hm .hl{font-size:10.5px;font-weight:800;color:var(--mut);display:grid;place-items:center;text-align:center}
.hm-tip{position:fixed;z-index:300;background:var(--ink);color:var(--bg);padding:6px 11px;border-radius:9px;font-size:11.5px;font-weight:700;pointer-events:none;box-shadow:var(--sh-lg);direction:rtl;white-space:nowrap}

/* insight cards */
.ins{padding:15px 16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--brand);transition:.18s}
.ins:hover{box-shadow:var(--sh-lg);transform:translateY(-2px)}
.ins.i-ok{border-inline-start-color:var(--ok)}.ins.i-warn{border-inline-start-color:var(--warn)}.ins.i-bad{border-inline-start-color:var(--bad)}.ins.i-blue{border-inline-start-color:var(--blue)}.ins.i-amber{border-inline-start-color:var(--amber)}
.ins h4{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;margin-bottom:6px}
.ins h4 .ic{width:17px;height:17px;color:var(--brand)}
.ins.i-ok h4 .ic{color:var(--ok)}.ins.i-warn h4 .ic{color:var(--warn)}.ins.i-bad h4 .ic{color:var(--bad)}.ins.i-blue h4 .ic{color:var(--blue)}.ins.i-amber h4 .ic{color:var(--amber)}
.ins p{font-size:12.8px;color:var(--mut);font-weight:500;line-height:1.8}
.ins p b{color:var(--ink)}

/* paper (report preview) */
.paper{background:#fff;color:#1c2622;border-radius:var(--r);box-shadow:var(--sh-lg);padding:34px 38px;max-width:880px;margin-inline:auto;border:1px solid var(--line)}
.paper h2{font-size:20px;font-weight:900}
.paper h3{font-size:14.5px;font-weight:800;color:#0a6b53;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid #e2ece7;display:flex;align-items:center;gap:8px}
.paper .pp-h{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid #0d8a6a;padding-bottom:14px;margin-bottom:6px}
.paper .pp-meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:11.5px;color:#5b6b64;padding:9px 0 4px}
.paper table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.paper th{background:#f0f6f3;color:#33463f;padding:7px 10px;border:1px solid #dbe7e1;font-size:11.5px;text-align:start}
.paper td{padding:6.5px 10px;border:1px solid #e4ece7}
.paper .sm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.paper .sm{border:1px solid #dbe7e1;border-radius:10px;padding:11px 13px;background:#f8fbf9}
.paper .sm .lb{font-size:10.5px;color:#5b6b64;font-weight:700}
.paper .sm .v{font-family:'Cairo';font-size:17px;font-weight:900;color:#0a6b53}
.paper .nt{font-size:10.5px;color:#8a9a92;margin-top:4px}

/* AI panel */
.ai-panel{border:1.5px dashed var(--blue);border-radius:var(--r);padding:16px;background:var(--blue-soft);margin-top:16px}
.ai-panel h4{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--blue);margin-bottom:6px}
.ai-out{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:14px;font-size:13px;line-height:1.9;white-space:pre-wrap;display:none}

/* misc */
.muted{color:var(--mut)}
.sec-title{font-size:16px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.sec-title .ic{color:var(--brand)}
.hr-d{border:none;border-top:1px dashed var(--line);margin:14px 0}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.page-head h2{font-size:19px;font-weight:900;flex:1}
.cnt-badge{font-size:11px;font-weight:800;background:var(--brand-soft);color:var(--brand);padding:2px 10px;border-radius:20px;margin-inline-start:4px}
.ds-tag{font-size:11px;font-weight:800;padding:3px 11px;border-radius:20px}
.ds-master{background:var(--brand-soft);color:var(--brand)}
.ds-delivery{background:var(--amber-soft);color:var(--amber)}
.ds-preorder{background:var(--blue-soft);color:var(--blue)}
.scope-tabs{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.scope-tabs button{padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--mut);transition:.15s}
.scope-tabs button.on{background:var(--card);color:var(--brand);box-shadow:var(--sh)}
.cat-mgr-row{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:9px;background:var(--card2);transition:.15s}
.cat-mgr-row:hover{border-color:var(--brand)}
.cat-mgr-row input.cname{width:140px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:800}
.kw-chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);padding:2.5px 6px 2.5px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.kw-chip button{color:var(--bad);display:grid;place-items:center;width:15px;height:15px}
.kw-chip .ic{width:11px;height:11px}

/* ================= Print ================= */
#print-area{display:none}
@media print{
  @page{size:A4;margin:22mm 12mm 18mm}
  body{background:#fff!important}
  body::before{display:none}
  #app,#toasts,.modal-ov{display:none!important}

  #print-area .paper{box-shadow:none;border:none;padding:0;max-width:none}

#sb-ov{display:none}
@media(max-width:1100px){.g-21,.g-12,.g-221{grid-template-columns:1fr}.g-3{grid-template-columns:1fr 1fr}}

}

/* ---------------- 2) Utilities ---------------- */
const $=(s,r)=> (r||document).querySelector(s);
const $$=(s,r)=> Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=> (crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(16).slice(2));
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
const AR_D='٠١٢٣٤٥٦٧٨٩', FA_D='۰۱۲۳۴۵۶۷۸۹';
const toEnDigits=s=>String(s).replace(/[٠-٩]/g,d=>AR_D.indexOf(d)).replace(/[۰-۹]/g,d=>FA_D.indexOf(d));

/* dates — stored internally as ISO 'YYYY-MM-DD', displayed DD/MM/YYYY */
const pad2=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
function isoOf(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function addDaysISO(iso,n){const [y,m,dd]=iso.split('-').map(Number);const d=new Date(y,m-1,dd+n);return isoOf(d);}
function excelToISO(n){const ms=Math.round((n-25569)*86400000);const d=new Date(ms);return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;}
/* Accepts: Date, excel serial number, 'YYYY-MM-DD', 'DD/MM/YYYY', 'DD-MM-YYYY', 'DD.MM.YEAR'... */
function parseDateAny(v){
  try{
    if(v==null||v==='')return null;
    if(v instanceof Date && !isNaN(v))return isoOf(v);
    if(typeof v==='number'&&isFinite(v)){ if(v>15000&&v<80000)return excelToISO(v); return null; }
    let s=toEnDigits(String(v)).trim().split(/[ T]/)[0];
    let m=s.match(/^(\d{4})[-\/\.](\d{1,2})[-\/\.](\d{1,2})$/);
    if(m){const[y,mo,d]=m.map(Number);return validD(y,mo,d)?`${y}-${pad2(mo)}-${pad2(d)}`:null;}
    m=s.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{4})$/);
    if(m){const[d,mo,y]=m.map(Number);return validD(y,mo,d)?`${y}-${pad2(mo)}-${pad2(d)}`:null;}
    const dt=new Date(s);
    if(!isNaN(dt)&&/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
    return null;
  }catch(e){return null;}
}
function validD(y,mo,d){return y>=1980&&y<=2100&&mo>=1&&mo<=12&&d>=1&&d<=31;}
const fmtD=iso=>{if(!iso)return '—';const p=iso.split('-');return `${p[2]}/${p[1]}/${p[0]}`;};

/* numbers — always English digits, thousands separators, IQD */
function parseNum(v){
  if(typeof v==='number'&&isFinite(v))return v;
  if(v==null||v==='')return null;
  const s=toEnDigits(String(v)).replace(/[^\d\.\-]/g,'');
  if(s===''||s==='-'||s==='.')return null;
  const n=parseFloat(s);return isFinite(n)?n:null;
}
const fmtN=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const fmtM=n=>`${fmtN(n)} IQD`;
const pctS=(a,b)=> b>0? ((a/b)*100).toFixed(1)+'%':'0%';

/* Arabic/Kurdish text normalization for search & keyword matching */
function normAr(s){
  return toEnDigits(String(s||''))
    .replace(/[\u064B-\u0652\u0670\u0640\u06D6-\u06ED]/g,'')      // diacritics & marks
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/[ی]/g,'ي')
    .replace(/[ک]/g,'ك').replace(/گ/g,'ك').replace(/چ/g,'ج').replace(/پ/g,'ب')
    .replace(/ڕ/g,'ر').replace(/ڵ/g,'ل').replace(/ۆ/g,'و').replace(/ێ/g,'ي')
    .replace(/ە/g,'ه').replace(/ڤ/g,'ف').replace(/ژ/g,'ز').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/\s+/g,' ').trim().toLowerCase();
}

/* ---------------- 3) Storage (localStorage + IndexedDB fallback) ---------------- */
const LS_KEY='sra_data_v1', LS_IDB_FLAG='sra_data_v1_idb';
function idbOpen(){return new Promise((res,rej)=>{const q=indexedDB.open('sra_db',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbSet(k,v){const db=await idbOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function idbGet(k){const db=await idbOpen();return new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbDel(k){try{const db=await idbOpen();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;});}catch(e){}}

async function loadData(){
  try{
    if(localStorage.getItem(LS_IDB_FLAG)==='1'){
      const d=await idbGet(LS_KEY);
      if(d){mergeData(d);return;}

function mergeData(d){
  if(!d||typeof d!=='object')return;
  Data.master=Array.isArray(d.master)?d.master:[];
  Data.delivery=Array.isArray(d.delivery)?d.delivery:[];
  Data.preorder=Array.isArray(d.preorder)?d.preorder:[];
  if(Array.isArray(d.categories)&&d.categories.length)Data.categories=d.categories;
  Data.overrides=d.overrides&&typeof d.overrides==='object'?d.overrides:{};
  Data.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),d.settings||{});
  Data.settings.widgets=Object.assign({},DEFAULT_SETTINGS.widgets,Data.settings.widgets||{});
  Data.settings.reportSecs=Object.assign({},DEFAULT_SETTINGS.reportSecs,Data.settings.reportSecs||{});

function detectCat(name){

  for(const c of Data.categories){

  }
  return 'أخرى';
}

/* record status: paid / partial / unpaid */
function recStatus(r){ if(r.unpaid<=0)return 'paid'; if(r.paid>0)return 'part'; return 'unpaid'; }
const STATUS_TXT={paid:'مدفوع',part:'جزئي',unpaid:'غير مدفوع'};
const STATUS_CLS={paid:'st-ok',part:'st-warn',unpaid:'st-bad'};

/* ---------------- 6) Filtering ---------------- */
const WD=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
function startOfWeekISO(iso){const[y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);const off=(dt.getDay()+1)%7;return addDaysISO(iso,-off);}
function monthRange(offset){const n=new Date();const y=n.getFullYear(),m=n.getMonth()+offset;const f=new Date(y,m,1),l=new Date(y,m+1,0);return[isoOf(f),isoOf(l)];}

function newFState(preset){const st={q:'',cat:'',status:'',min:'',max:'',customer:'',preset:preset||'all',from:null,to:null};applyPreset(st);return st;}
function applyPreset(st){
  const t=todayISO();
  if(st.preset==='today'){st.from=t;st.to=t;}
  else if(st.preset==='week'){st.from=startOfWeekISO(t);st.to=t;}
  else if(st.preset==='month'){const r=monthRange(0);st.from=r[0];st.to=r[1];}
  else if(st.preset==='lastmonth'){const r=monthRange(-1);st.from=r[0];st.to=r[1];}
  else if(st.preset!=='custom'){st.from=null;st.to=null;}
}
function applyFilter(rows,st){
  const q=normAr(st.q);
  const min=st.min===''?null:parseNum(st.min), max=st.max===''?null:parseNum(st.max);
  return rows.filter(r=>{
    if(st.from&&r.date<st.from)return false;
    if(st.to&&r.date>st.to)return false;
    if(q&&!normAr(r.customer).includes(q))return false;
    if(st.cat&&catOf(r)!==st.cat)return false;
    if(st.customer&&custKey(r.customer)!==st.customer)return false;
    if(st.status&&recStatus(r)!==st.status)return false;
    if(min!=null&&r.cost<min)return false;
    if(max!=null&&r.cost>max)return false;
    return true;
  });
}
function prevRange(st){
  if(!st.from||!st.to)return null;
  const[a,b,c]=st.from.split('-').map(Number),[d,e,f]=st.to.split('-').map(Number);
  const len=Math.round((new Date(d,e-1,f)-new Date(a,b-1,c))/86400000)+1;
  return{from:addDaysISO(st.from,-len),to:addDaysISO(st.from,-1)};
}
const uniqCustomers=ds=>{const m=new Map();ds.forEach(r=>{const k=custKey(r.customer);if(!m.has(k))m.set(k,r.customer);});return m;};

/* animated counter */
function countUp(elm,val,fmt){
  fmt=fmt||fmtN;
  const from=parseFloat(elm.dataset.v||0),to=Number(val)||0;
  elm.dataset.v=to;
  const t0=performance.now(),dur=900;
  (function step(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    elm.textContent=fmt(from+(to-from)*e);
    if(p<1)requestAnimationFrame(step);else elm.textContent=fmt(to);
  })(t0);
}

  {k:'name',al:['اسم الزبون','الزبون','اسم العميل','customer name','customer','client','name']},

async function parseImportFile(file){
  const wb=await new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{try{
      if(/\.csv$/i.test(file.name))res(XLSX.read(rd.result,{type:'string'}));
      else res(XLSX.read(rd.result,{type:'array',cellDates:true}));
    }catch(e){rej(new Error('تعذر قراءة الملف — تأكد أنه ملف Excel سليم'));}};
    rd.onerror=()=>rej(new Error('فشل فتح الملف'));
    rd.readAsArrayBuffer(file);
  });
  const ws=wb.Sheets[wb.SheetNames[0]];
  const grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  if(!grid.length)throw new Error('الملف فارغ');
  // detect header row within first 5 rows
  let colMap={date:0,name:1,cost:2,paid:3,unpaid:4},start=0;
  outer: for(let i=0;i<Math.min(5,grid.length);i++){
    const row=grid[i].map(c=>normAr(String(c)));
    const m={};
    // pass 1: exact alias match
    HEADER_MAP.forEach(h=>{const ix=row.findIndex(c=>c&&h.al.some(a=>normAr(a)===c));if(ix>=0)m[h.k]=ix;});
    // pass 2: fuzzy "contains" match for unmapped keys — never map 'paid' onto an unpaid cell
    HEADER_MAP.forEach(h=>{
      if(m[h.k]!=null)return;
      const ix=row.findIndex((c,ci)=>c&&!Object.values(m).includes(ci)
        &&h.al.some(a=>c.includes(normAr(a)))
        &&!(h.k==='paid'&&/(unpaid|غير)/.test(c)));
      if(ix>=0)m[h.k]=ix;
    });
    if((m.date!=null||m.name!=null)&&(m.cost!=null||m.paid!=null)){colMap=Object.assign({date:0,name:1,cost:2,paid:3,unpaid:4},m);start=i+1;break outer;}
  }
  const existing=new Set(Data.master.concat(Data.delivery,Data.preorder).map(r=>r.date+'|'+custKey(r.customer)+'|'+Math.round(r.cost)));
  const seen=new Set(),out=[];
  for(let i=start;i<grid.length;i++){
    const raw=grid[i];
    if(raw.every(c=>c===''||c==null))continue;
    const get=k=>colMap[k]!=null?raw[colMap[k]]:undefined;
    const date=parseDateAny(get('date'));
    const name=String(get('name')??'').trim();
    const cost=parseNum(get('cost'));
    let paid=parseNum(get('paid'));if(paid==null)paid=0;
    let unpaid=parseNum(get('unpaid'));
    const rec={date,customer:name,cost,paid,unpaid:unpaid==null?null:unpaid,rowNum:i+1,problems:[]};
    if(!date)rec.problems.push('تاريخ غير صالح');
    if(!name)rec.problems.push('اسم الزبون فارغ');
    if(cost==null||cost<0)rec.problems.push('مبلغ غير رقمي');
    if(rec.problems.length){rec.state='bad';out.push(rec);continue;}
    if(unpaid==null)rec.unpaid=Math.max(0,cost-paid);
    rec.unpaid=Math.max(0,rec.unpaid);
    const k=date+'|'+custKey(name)+'|'+Math.round(cost);
    if(seen.has(k)||existing.has(k)){rec.state='dup';rec.problems.push('مكرر (نفس التاريخ والزبون والمبلغ)');out.push(rec);continue;}
    seen.add(k);rec.state='ok';out.push(rec);
  }
  return out;
}

function trendHtml(cur,prev){
  if(prev==null||prev<=0)return '<span class="k-tr fl">—</span>';
  const p=((cur-prev)/prev)*100;
  if(Math.abs(p)<0.05)return '<span class="k-tr fl">ثابت</span>';
  return p>0?`<span class="k-tr up">${icon('up')} ${Math.abs(p).toFixed(1)}%</span>`
            :`<span class="k-tr dn">${icon('down')} ${Math.abs(p).toFixed(1)}%</span>`;
}

  const M=sum(m),D=sum(d),P=sum(p);

  const top=Object.values(custAgg).sort((a,b)=>b.c-a.c).slice(0,10);

/* PDF: html2canvas slice → jsPDF A4, Arabic-safe header/footer rendered as canvas */
async function renderStrip(html,widthPx,ptH,ratio){
  const d=document.createElement('div');
  d.style.cssText=`position:fixed;left:-9999px;top:0;width:${widthPx}px;background:#ffffff;color:#1c2622;font-family:'Tajawal',sans-serif;font-size:${Math.round(10.5*ratio)}px;`;
  d.innerHTML=html;document.body.appendChild(d);
  const c=await html2canvas(d,{scale:2,backgroundColor:'#ffffff',logging:false});
  document.body.removeChild(d);return c;
}
async function exportElementPDF(el,fname,rangeTxt){
  if(!window.html2canvas||!window.jspdf){toast('مكتبات PDF غير متوفرة','err');return;}
  toast('جارٍ إنشاء ملف PDF...','warn');
  try{
    await document.fonts.ready;
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
    const{jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'pt',format:'a4',compress:true});
    const PW=595.28,PH=841.89,MG=32,HH=46,FH=26;
    const iw=PW-2*MG,ih=PH-HH-FH-MG*1.5;
    const ratio=canvas.width/iw;
    const slicePx=Math.floor(ih*ratio);
    const gen=fmtD(todayISO());
    const hCan=await renderStrip(`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:${Math.max(2,ratio*1.5)}px solid #0d8a6a;padding:0 4px ${Math.round(4*ratio)}px">
      <b style="font-family:'Cairo';font-size:${Math.round(15*ratio)}px;color:#0a6b53">${esc(Data.settings.appName)}</b>
      <span style="color:#5b6b64;font-weight:700">${esc(fname.replace('.pdf',''))}</span></div>`,el.clientWidth,HH,ratio);
    const fCan=await renderStrip(`<div style="display:flex;justify-content:space-between;border-top:1px solid #cfdcd4;padding:${Math.round(3*ratio)}px 4px 0;color:#7c8b84;font-size:${Math.round(9*ratio)}px">
      <span>الفترة: <b>${rangeTxt}</b></span><span>أُنشئ بتاريخ: <b>${gen}</b></span></div>`,el.clientWidth,FH,ratio);
    const pageH=Math.round(PH*ratio);
    let y=0,page=0;
    while(y<canvas.height){
      const sh=Math.min(slicePx,canvas.height-y);
      const pc=document.createElement('canvas');pc.width=canvas.width;pc.height=pageH;
      const ctx=pc.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,pc.width,pc.height);
      const hdrH=Math.round(HH*ratio),ftrH=Math.round(FH*ratio);
      ctx.drawImage(hCan,0,Math.round(MG*ratio*.6),canvas.width,hdrH);
      ctx.drawImage(canvas,0,y,canvas.width,sh,0,Math.round(MG*ratio*.6)+hdrH+Math.round(6*ratio),canvas.width,sh);
      ctx.drawImage(fCan,0,pageH-ftrH-Math.round(MG*ratio*.4),canvas.width,ftrH);
      if(page>0)pdf.addPage();
      pdf.addImage(pc.toDataURL('image/jpeg',0.93),'JPEG',0,0,PW,PH);
      y+=slicePx;page++;
    }
    pdf.save(fname);
    toast('تم إنشاء ملف PDF بنجاح');
  }catch(e){console.error(e);toast('فشل إنشاء PDF: '+e.message,'err');}
}

function computeAnalytics(){
  const m=applyFilter(Data.master,AN.f).sort((a,b)=>a.date<b.date?-1:1);
  const A={rows:m};
  const T=m.reduce((t,r)=>{t.n++;t.c+=r.cost;t.p+=r.paid;t.u+=r.unpaid;return t;},{n:0,c:0,p:0,u:0});

function bindHeatTips(scope){
  let tip=null;
  scope.querySelectorAll('[data-tip]').forEach(c=>{
    c.addEventListener('mouseenter',e=>{tip=document.createElement('div');tip.className='hm-tip';tip.textContent=c.dataset.tip;document.body.appendChild(tip);});
    c.addEventListener('mousemove',e=>{if(tip){tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-34)+'px';}});
    c.addEventListener('mouseleave',()=>{if(tip){tip.remove();tip=null;}});
  });

async function aiDeep(A){
  const key=Data.settings.aiKey;
  const out=$('#ai-out');out.style.display='block';
  if(!key){out.innerHTML='⚠️ لم يُدخل مفتاح API — أضفه في الحقل أعلاه أو من صفحة إدارة البيانات. التحليل المحلي (أعلاه) يعمل دائماً دون اتصال.';return;}
  out.innerHTML='<div class="spin"></div>';
  const summary={period:{from:AN.f.from,to:AN.f.to},orders:A.tot.n,sales:A.tot.c,paid:A.tot.p,unpaid:A.tot.u,
    collectionRate:+(A.collection*100).toFixed(1),aov:Math.round(A.aov),
    growthVsPrevPct:A.growth==null?null:+A.growth.toFixed(1),top5ConcentrationPct:+(A.top5share*100).toFixed(1),
    retentionPct:+(A.retention*100).toFixed(1),pareto80Customers:A.pareto.n,totalCustomers:A.custCount,
    newCustomers:A.news.length,outliers:A.outliers.length,bestDayOfMonth:A.bestDom?+A.bestDom[0]:null,
    weekdaySales:A.wd.map((w,i)=>({day:WD[i],sales:w.c,orders:w.n})),
    categories:Object.entries((()=>{const c={};A.rows.forEach(r=>{const cc=catOf(r);c[cc]=(c[cc]||0)+r.cost;});return c;})()).map(([n,v])=>({name:n,sales:v})),
    forecast:A.forecast?{days:A.forecast.days,total:Math.round(A.forecast.total)}:null};
  try{
    const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'gpt-4o-mini',temperature:.4,max_tokens:900,messages:[
        {role:'system',content:'أنت محلل مبيعات محترف. اكتب تحليلاً عميقاً باللغة العربية (أرقام إنجليزية) بناءً على ملخص JSON: التقييم، الأسباب المحتملة، المخاطر، و5 توصيات عملية مرتبة. بدون مقدمات طويلة.'},
        {role:'user',content:JSON.stringify(summary)}]})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const j=await res.json();
    out.innerHTML=esc(j.choices?.[0]?.message?.content||'لم يُرجع النموذج نصاً.');
  }catch(e){out.innerHTML='⚠️ تعذر الاتصال بخدمة الذكاء الاصطناعي: '+esc(e.message)+' — التحليل المحلي يظل متاحاً أعلاه.';}
}

  });
  renderDsMgr();renderCatMgr();renderOvList();
  // backup
  pg.querySelector('#dm-backup').onclick=()=>{
    try{const blob=new Blob([JSON.stringify(Data,null,1)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup-${Data.settings.appName.replace(/\s+/g,'-')}-${todayISO()}.json`;a.click();
      toast('تم تنزيل النسخة الاحتياطية');}catch(e){toast('فشل التنزيل: '+e.message,'err');}
  };
  // restore
  pg.querySelector('#dm-restore').onclick=()=>pg.querySelector('#dm-restore-f').click();
  pg.querySelector('#dm-restore-f').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const txt=await f.text();const d=JSON.parse(txt);
      if(!Array.isArray(d.master)&&!Array.isArray(d.categories))throw new Error('الملف ليس نسخة احتياطية صالحة');
      const ok=await confirmBox('ستُستبدل جميع البيانات الحالية بمحتوى النسخة الاحتياطية. هل أنت متأكد؟',{title:'استعادة نسخة',ok:'استعادة',danger:true});
      if(!ok)return;
      mergeData(d);await saveData();location.reload();
    }catch(err){toast('فشل الاستعادة: '+err.message,'err');}
    e.target.value='';
  };
  // clear all (double confirm)
  pg.querySelector('#dm-clearall').onclick=async()=>{
    const c1=await confirmBox('سيتم <b>حذف جميع البيانات نهائياً</b>: السجلات الرئيسية والتوصيل والطلبات المسبقة والتصنيفات المخصصة.',{title:'تحذير — مسح شامل',ok:'متابعة',danger:true});
    if(!c1)return;
    const c2=await confirmBox('تأكيد أخير: <b>لا يمكن التراجع</b> عن هذا الإجراء. ننصح بتنزيل نسخة احتياطية أولاً. هل تمسح كل شيء فعلاً؟',{title:'التأكيد النهائي',ok:'نعم، امسح كل شيء',danger:true});
    if(!c2)return;
    Data.master=[];Data.delivery=[];Data.preorder=[];Data.overrides={};
    await saveData();refreshEverything();toast('تم مسح جميع البيانات');
  };
  pg.querySelector('#dm-demo').onclick=()=>seedDemo(false);
  // add category
  pg.querySelector('#dm-addcat').onclick=()=>{Data.categories.push({name:'تصنيف جديد',keywords:[]});saveData();renderCatMgr();};
  // override apply
  pg.querySelector('#ov-apply').onclick=()=>{
    const n=pg.querySelector('#ov-name').value.trim(),c=pg.querySelector('#ov-cat').value;
    if(!n){toast('أدخل اسم الزبون','err');return;}
    setOverride(n,c);saveData();renderOvList();toast(`تم تعيين «${c}» للزبون ${n}`);
  };
  DATA_PG.init=true;
}
function renderDsMgr(){
  const box=$('#dm-ds');if(!box)return;
  box.innerHTML=Object.keys(DS_META).map(k=>{
    const meta=DS_META[k],n=Data[k].length,sum=Data[k].reduce((s,r)=>s+r.cost,0);
    return `<div class="cat-mgr-row">
      <span class="ds-tag ${meta.cls}">${meta.label}</span>
      <span class="muted num" style="font-size:12px;font-weight:700">${fmtN(n)} سجل • ${fmtM(sum)}</span>
      <div style="flex:1"></div>
      <button class="btn btn-sm" onclick="importFlow('${k}')">${icon('ul')} استيراد</button>
      <button class="btn btn-sm" onclick="exportXlsx('${k}')">${icon('dl')} تصدير</button>
      <button class="btn btn-sm btn-ghost" style="color:var(--bad)" onclick="clearSingleDs('${k}')">${icon('trash')} مسح</button>
    </div>`;}).join('');
}
async function clearSingleDs(k){
  if(!Data[k].length){toast('المجموعة فارغة أصلاً','warn');return;}
  const ok=await confirmBox(`سيتم مسح <b class="num">${fmtN(Data[k].length)}</b> سجل من «${DS_META[k].label}» نهائياً.`,{title:'مسح مجموعة',ok:'مسح',danger:true});
  if(!ok)return;
  Data[k]=[];await saveData();renderDsMgr();refreshEverything();toast('تم مسح المجموعة');
}
function renderCatMgr(){
  const box=$('#dm-cats');if(!box)return;
  box.innerHTML=Data.categories.map((c,ix)=>`
    <div class="cat-mgr-row" data-ix="${ix}">
      <input class="cname" value="${esc(c.name)}" data-role="name">
      <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center;flex:1">
        ${c.keywords.map((k,ki)=>`<span class="kw-chip">${esc(k)}<button data-rmkw="${ki}">${icon('x')}</button></span>`).join('')}
        <input class="inp" style="width:130px;padding:4px 10px;font-size:12px" placeholder="+ كلمة مفتاحية" data-role="kw">
      </div>
      <button class="rbtn dngr" data-delcat title="حذف التصنيف">${icon('trash')}</button>
    </div>`).join('')||'<p class="muted">لا توجد تصنيفات.</p>';
  box.querySelectorAll('.cat-mgr-row').forEach(row=>{
    const ix=+row.dataset.ix;
    row.querySelector('[data-role=name]').onchange=e=>{Data.categories[ix].name=e.target.value.trim()||Data.categories[ix].name;saveData();toast('تم التحديث');};
    const kw=row.querySelector('[data-role=kw]');
    const addKw=()=>{const v=kw.value.trim();if(v){Data.categories[ix].keywords.push(v);saveData();renderCatMgr();}};
    kw.onkeydown=e=>{if(e.key==='Enter')addKw();};
    kw.onblur=addKw;
    row.querySelectorAll('[data-rmkw]').forEach(b=>b.onclick=()=>{Data.categories[ix].keywords.splice(+b.dataset.rmkw,1);saveData();renderCatMgr();});
    row.querySelector('[data-delcat]').onclick=async()=>{
      const c=Data.categories[ix];
      const ok=await confirmBox(`حذف تصنيف «${esc(c.name)}»؟ الزبائن المطابقون له سيتحولون إلى «أخرى».`,{ok:'حذف',danger:true});
      if(!ok)return;
      Data.categories.splice(ix,1);
      Object.keys(Data.overrides).forEach(kk=>{if(Data.overrides[kk]===c.name)delete Data.overrides[kk];});
      saveData();renderCatMgr();toast('تم حذف التصنيف');
    };
  });
}
function renderOvList(){
  const box=$('#ov-list');if(!box)return;
  const ent=Object.entries(Data.overrides);
  box.innerHTML=ent.length?ent.map(([k,c])=>`<span class="kw-chip" style="margin:3px">${esc(k)} ← <b>${esc(c)}</b>
    <button data-rmov="${esc(k)}">${icon('x')}</button></span>`).join('')
    :'<p class="muted" style="font-size:12px">لا توجد تعيينات يدوية — يعمل الكشف التلقائي من الكلمات المفتاحية.</p>';
  box.querySelectorAll('[data-rmov]').forEach(b=>b.onclick=()=>{delete Data.overrides[b.dataset.rmov];saveData();renderOvList();toast('أزيل التعيين اليدوي');});
}

/* ---------------- demo data generator ---------------- */
const DEMO_CUSTOMERS=['مطعم زاخروس','كافي روشنا','شركة عبدولا جوهر','ماركيت نجات','كاك نزهي عزيز','خاتوو دلنيا','حلويات شهرزاد','معمل أريوان','قوتابخانة نالين','مرطبات هەڵگورد','مام ستار','محل كازان','مطعم بيريفان','كافي لاتيه','شركة هەردی للتجارة','ماركيت روژ','كاك شيرزاد','خاتوو شاناز','حلويات دلشاد','معمل سركوتن','مطعم قلعة أربيل','قوتابخانة هانا','أزاد محمد','شيلان كريم','هيمن رشيد','محل زمناكو','مرطبات سارين'];
function seedDemo(force){
  const doSeed=async()=>{
    const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a));
    const gen=(count,maxDaysAgo)=>{
      const arr=[];const t=todayISO();
      for(let i=0;i<count;i++){
        const date=addDaysISO(t,-rnd(0,maxDaysAgo));
        const customer=DEMO_CUSTOMERS[rnd(0,DEMO_CUSTOMERS.length)];
        const cost=rnd(3,300)*5000+(Math.random()<0.06?rnd(300000,900000):0);
        const pr=Math.random();
        const paid=pr<0.55?cost:pr<0.85?Math.floor(cost*Math.random()):0;
        arr.push({id:uid(),date,customer,cost,paid,unpaid:Math.max(0,cost-paid)});
      }
      return arr;
    };
    Data.master=Data.master.concat(gen(240,120));
    Data.delivery=Data.delivery.concat(gen(45,90));
    Data.preorder=Data.preorder.concat(gen(28,60));
    await saveData();refreshEverything();
    toast('تم توليد بيانات تجريبية — استكشف الأقسام!');
  };
  if(force||(!Data.master.length&&!Data.delivery.length&&!Data.preorder.length)){doSeed();return;}
  confirmBox('سيتم إضافة سجلات تجريبية إلى البيانات الحالية. متابعة؟',{ok:'توليد'}).then(ok=>{if(ok)doSeed();});
}

/* =====================================================================
   15) Router, theme, boot
   ===================================================================== */
const PAGES=[
  {id:'dash',lb:'لوحة التحكم',ic:'dash',grp:'نظرة عامة'},
  {id:'master',lb:'البيانات الرئيسية',ic:'rows',grp:'البيانات'},
  {id:'delivery',lb:'التوصيل',ic:'truck',grp:'البيانات'},
  {id:'preorder',lb:'الطلبات المسبقة',ic:'pre',grp:'البيانات'},
  {id:'report',lb:'مولد التقارير',ic:'rep',grp:'التقارير'},
  {id:'analytics',lb:'التحليلات الذكية',ic:'ana',grp:'التقارير'},
  {id:'cats',lb:'تصنيفات المشترين',ic:'tag',grp:'التقارير'},
  {id:'data',lb:'إدارة البيانات',ic:'db',grp:'النظام'},
];
let CUR_PAGE='dash';
function buildNav(){
  const nav=$('#sb-nav');let html='',grp='';
  PAGES.forEach(p=>{
    if(p.grp!==grp){grp=p.grp;html+=`<div class="sb-label">${grp}</div>`;}
    const badge=(p.id==='master'||p.id==='delivery'||p.id==='preorder')?`<span class="nbadge num" data-nb="${p.id}">${fmtN(Data[p.id].length)}</span>`:'';
    html+=`<button class="nav-it ${p.id===CUR_PAGE?'on':''}" data-pg="${p.id}">${icon(p.ic)}<span>${p.lb}</span>${badge}</button>`;
  });
  nav.innerHTML=html;
  nav.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{showPage(b.dataset.pg);document.body.classList.remove('sb-open');});
}
function refreshNavBadges(){
  $$('#sb-nav [data-nb]').forEach(b=>b.textContent=fmtN(Data[b.dataset.nb].length));
}
function showPage(id){
  CUR_PAGE=id;
  $$('.page').forEach(s=>s.classList.toggle('on',s.id==='p-'+id));
  $$('#sb-nav .nav-it').forEach(b=>b.classList.toggle('on',b.dataset.pg===id));
  const meta=PAGES.find(p=>p.id===id);
  $('#tb-title').textContent=meta.lb;
  // lazy init + refresh
  if(id==='dash'){if(!DASH.init)initDash();renderDash();}
  if(id==='master'||id==='delivery'||id==='preorder'){if(!PAGE_STATE[id]?.init)initDsPage(id);renderDs(id);}
  if(id==='report'){if(!REP.init)initReport();renderReport();}
  if(id==='analytics'){if(!AN.init)initAnalytics();renderAnalytics();}
  if(id==='cats'){if(!CATPG.init)initCatPage();renderCatPage();}
  if(id==='data'){if(!DATA_PG.init)initDataPage();renderDsMgr();renderCatMgr();renderOvList();
    const nm=$('#dm-appname');if(nm)nm.value=Data.settings.appName;
    $$('#dm-theme button').forEach(x=>x.classList.toggle('on',x.dataset.t===Data.settings.theme));}
  window.scrollTo({top:0,behavior:'smooth'});
}
function refreshEverything(){
  refreshNavBadges();updateStorInfo();
  if(DASH.init&&CUR_PAGE==='dash')renderDash();
  ['master','delivery','preorder'].forEach(k=>{if(PAGE_STATE[k]?.init&&CUR_PAGE===k)renderDs(k);});
  if(REP.init&&CUR_PAGE==='report')renderReport();
  if(AN.init&&CUR_PAGE==='analytics')renderAnalytics();
  if(CATPG.init&&CUR_PAGE==='cats')renderCatPage();
  if(DATA_PG.init&&CUR_PAGE==='data'){renderDsMgr();renderCatMgr();renderOvList();}
}
function setTheme(t){
  Data.settings.theme=t;document.documentElement.dataset.theme=t;
  $('#btn-theme').innerHTML=icon(t==='dark'?'sun':'moon');
  saveData();
  // re-render current page so charts pick new colors
  clearTimeout(setTheme._t);setTheme._t=setTimeout(()=>refreshEverything(),60);
}
function applyAppName(){
  $('#app-name-lbl').textContent=Data.settings.appName;
  document.title=Data.settings.appName+' — تقارير المبيعات';
}
async function boot(){
  // static chrome
  $('#sb-logo').innerHTML=icon('box');
  $('#btn-menu').innerHTML=icon('menu');
  $('#btn-menu').onclick=()=>document.body.classList.toggle('sb-open');
  $('#btn-theme').onclick=()=>setTheme(Data.settings.theme==='dark'?'light':'dark');
  $('#tb-date').innerHTML=`اليوم: <b class="num">${fmtD(todayISO())}</b> • ${WD[(new Date().getDay()+1)%7]}`;
  await loadData();
  applyAppName();
  document.documentElement.dataset.theme=Data.settings.theme;
  $('#btn-theme').innerHTML=icon(Data.settings.theme==='dark'?'sun':'moon');
  buildNav();
  updateStorInfo();
  showPage('dash');
}
boot();
